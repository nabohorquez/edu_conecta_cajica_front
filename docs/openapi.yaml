openapi: 3.0.3
info:
  title: API EDUConecta Cajicá
  version: 1.0.0
  description: |
    API en español para la formación y el seguimiento de competencias
    tecnológicas de docentes. La autenticación usa tokens personales de
    Laravel Sanctum. Las solicitudes y respuestas usan JSON, salvo las
    descargas de archivos y la exportación CSV.
servers:
  - url: /api/v1
    description: API versionada del servidor actual
security:
  - token: []
tags:
  - name: Autenticación
  - name: Perfil
  - name: Usuarios y roles
  - name: Formación
  - name: Diagnóstico
  - name: Evaluaciones
  - name: Seguimiento e informes
  - name: Conectividad y notificaciones
  - name: Tableros
paths:
  /salud:
    get:
      tags: [Autenticación]
      security: []
      summary: Comprobar disponibilidad de la API
      responses:
        '200':
          description: API disponible.
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado:
                    type: string
                    example: disponible
  /autenticacion/iniciar-sesion:
    post:
      tags: [Autenticación]
      security: []
      summary: Iniciar sesión y emitir un token
      description: Limitado a cinco intentos por minuto por correo e IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Token emitido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje: { type: string }
                  token: { type: string, description: Token Bearer de Sanctum }
                  usuario: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Validacion' }
        '429': { $ref: '#/components/responses/Error' }
  /autenticacion/cerrar-sesion:
    post:
      tags: [Autenticación]
      summary: Revocar el token actual
      responses:
        '200': { $ref: '#/components/responses/Mensaje' }
        '401': { $ref: '#/components/responses/Error' }
  /autenticacion/usuario-actual:
    get:
      tags: [Autenticación]
      summary: Consultar identidad y roles de la sesión
      responses:
        '200':
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/Error' }
  /autenticacion/solicitar-restablecimiento:
    post:
      tags: [Autenticación]
      security: []
      summary: Solicitar un enlace de restablecimiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { $ref: '#/components/responses/Mensaje' }
        '422': { $ref: '#/components/responses/Validacion' }
        '503': { $ref: '#/components/responses/Error' }
  /autenticacion/restablecer-contrasena:
    post:
      tags: [Autenticación]
      security: []
      summary: Restablecer contraseña con un token enviado por correo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, contrasena, contrasena_confirmation]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                contrasena: { type: string, minLength: 8, format: password }
                contrasena_confirmation: { type: string, format: password }
      responses:
        '200': { $ref: '#/components/responses/Mensaje' }
        '422': { $ref: '#/components/responses/Validacion' }
  /perfil:
    get:
      tags: [Perfil]
      summary: Consultar perfil propio
      responses:
        '200':
          description: Perfil actual.
          content:
            application/json:
              schema:
                type: object
                properties:
                  perfil: { $ref: '#/components/schemas/Usuario' }
    put:
      tags: [Perfil]
      summary: Actualizar datos básicos propios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string, maxLength: 100 }
                last_name: { type: string, maxLength: 100 }
                email: { type: string, format: email }
      responses:
        '200': { $ref: '#/components/responses/Mensaje' }
        '422': { $ref: '#/components/responses/Validacion' }
  /perfil/contrasena:
    put:
      tags: [Perfil]
      summary: Cambiar contraseña propia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contrasena_actual, contrasena, contrasena_confirmation]
              properties:
                contrasena_actual: { type: string, format: password }
                contrasena: { type: string, minLength: 8, format: password }
                contrasena_confirmation: { type: string, format: password }
      responses:
        '200': { $ref: '#/components/responses/Mensaje' }
        '422': { $ref: '#/components/responses/Validacion' }
  /usuarios:
    get:
      tags: [Usuarios y roles]
      summary: Listar usuarios (administrador o sistemas)
      parameters:
        - in: query
          name: buscar
          schema: { type: string }
        - in: query
          name: rol
          schema: { type: string }
        - in: query
          name: activo
          schema: { type: boolean }
        - in: query
          name: por_pagina
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
      responses:
        '200': { $ref: '#/components/responses/ListaPaginada' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Usuarios y roles]
      summary: Crear usuario y asignar un rol (administrador o sistemas)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email, contrasena, rol_id]
              properties:
                first_name: { type: string, maxLength: 100 }
                last_name: { type: string, maxLength: 100 }
                email: { type: string, format: email }
                username: { type: string, nullable: true }
                contrasena: { type: string, minLength: 8, format: password }
                rol_id: { type: integer }
      responses:
        '201': { $ref: '#/components/responses/Mensaje' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Validacion' }
  /usuarios/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Usuarios y roles]
      summary: Consultar usuario (administrador o sistemas)
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [Usuarios y roles]
      summary: Actualizar usuario y rol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                username: { type: string, nullable: true }
                rol_id: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/Mensaje' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Validacion' }
    delete:
      tags: [Usuarios y roles]
      summary: Desactivar usuario sin eliminar su historial
      responses:
        '200': { $ref: '#/components/responses/Mensaje' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Validacion' }
  /usuarios/{id}/estado:
    patch:
      tags: [Usuarios y roles]
      summary: Activar o desactivar usuario (administrador o sistemas)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activo]
              properties:
                activo: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Mensaje' }
  /roles:
    get:
      tags: [Usuarios y roles]
      summary: Listar roles
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
    post:
      tags: [Usuarios y roles]
      summary: Crear rol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rol_name]
              properties:
                rol_name: { type: string, maxLength: 20 }
                description: { type: string, nullable: true, maxLength: 100 }
      responses:
        '201': { $ref: '#/components/responses/Objeto' }
        '422': { $ref: '#/components/responses/Validacion' }
  /roles/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Usuarios y roles]
      summary: Consultar rol, usuarios y permisos asociados
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
    put:
      tags: [Usuarios y roles]
      summary: Actualizar rol
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rol_name: { type: string, maxLength: 20 }
                description: { type: string, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
    delete:
      tags: [Usuarios y roles]
      summary: Eliminar rol sin usuarios asignados
      responses:
        '200': { $ref: '#/components/responses/Mensaje' }
        '409': { $ref: '#/components/responses/Error' }
  /roles/{id}/permisos:
    put:
      tags: [Usuarios y roles]
      summary: Reemplazar permisos de páginas asociados al rol
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permisos]
              properties:
                permisos:
                  type: array
                  items:
                    type: object
                    required: [pagina_id, permiso_id]
                    properties:
                      pagina_id: { type: integer }
                      permiso_id: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/Mensaje' }
        '422': { $ref: '#/components/responses/Validacion' }
  /catalogos/permisos:
    get:
      tags: [Usuarios y roles]
      summary: Listar páginas y permisos disponibles
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
  /niveles-competencia:
    get:
      tags: [Formación]
      summary: Listar niveles de competencia
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
    post:
      tags: [Formación]
      summary: Crear nivel (administrador o sistemas)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre: { type: string }
                descripcion: { type: string, nullable: true }
                orden: { type: integer, minimum: 0 }
                activo: { type: boolean }
      responses:
        '201': { $ref: '#/components/responses/Objeto' }
  /competencias:
    get:
      tags: [Formación]
      summary: Listar competencias
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
    post:
      tags: [Formación]
      summary: Crear competencia (administrador o sistemas)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nivel_id: { type: integer, nullable: true }
                nombre: { type: string }
                descripcion: { type: string, nullable: true }
                activo: { type: boolean }
      responses:
        '201': { $ref: '#/components/responses/Objeto' }
  /modulos-formativos:
    get:
      tags: [Formación]
      summary: Listar módulos activos (docentes, capacitadores y administración)
      parameters:
        - in: query
          name: nivel_id
          schema: { type: integer }
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200': { $ref: '#/components/responses/ListaPaginada' }
    post:
      tags: [Formación]
      summary: Crear módulo (administrador o sistemas)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuloEntrada'
      responses:
        '201': { $ref: '#/components/responses/Objeto' }
        '422': { $ref: '#/components/responses/Validacion' }
  /modulos-formativos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Formación]
      summary: Consultar módulo, lecciones, actividades y evaluaciones
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [Formación]
      summary: Actualizar módulo (administrador o sistemas)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuloEntrada'
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
    delete:
      tags: [Formación]
      summary: Desactivar módulo y conservar historial
      responses:
        '200': { $ref: '#/components/responses/Mensaje' }
  /lecciones:
    get:
      tags: [Formación]
      summary: Listar lecciones
      parameters:
        - in: query
          name: modulo_id
          schema: { type: integer }
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200': { $ref: '#/components/responses/ListaPaginada' }
    post:
      tags: [Formación]
      summary: Crear lección (administrador o sistemas)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeccionEntrada'
      responses:
        '201': { $ref: '#/components/responses/Objeto' }
  /lecciones/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Formación]
      summary: Consultar lección y sus recursos
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [Formación]
      summary: Actualizar lección
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeccionEntrada'
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
    delete:
      tags: [Formación]
      summary: Desactivar lección
      responses:
        '200': { $ref: '#/components/responses/Mensaje' }
  /lecciones/{id}/progreso:
    post:
      tags: [Formación]
      summary: Guardar progreso propio de una lección
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [porcentaje, estado]
              properties:
                porcentaje: { type: number, minimum: 0, maximum: 100 }
                estado: { type: string, enum: [en_progreso, completada] }
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
        '422': { $ref: '#/components/responses/Validacion' }
  /lecciones/{id}/recursos:
    get:
      tags: [Formación]
      summary: Listar recursos de una lección
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
  /recursos-formativos:
    get:
      tags: [Formación]
      summary: Listar recursos educativos
      parameters:
        - in: query
          name: modulo_id
          schema: { type: integer }
        - in: query
          name: leccion_id
          schema: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/ListaPaginada' }
    post:
      tags: [Formación]
      summary: Crear recurso (administrador o sistemas)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [titulo, tipo]
              properties:
                modulo_id: { type: integer }
                leccion_id: { type: integer }
                titulo: { type: string }
                descripcion: { type: string }
                tipo: { type: string, enum: [video, enlace, archivo] }
                url: { type: string, format: uri }
                archivo: { type: string, format: binary }
                orden: { type: integer }
      responses:
        '201': { $ref: '#/components/responses/Objeto' }
        '422': { $ref: '#/components/responses/Validacion' }
  /recursos-formativos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Formación]
      summary: Consultar recurso
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
    put:
      tags: [Formación]
      summary: Actualizar metadatos de recurso
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                titulo: { type: string }
                descripcion: { type: string }
                tipo: { type: string, enum: [video, enlace, archivo] }
                url: { type: string, format: uri }
                archivo: { type: string, format: binary }
                orden: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
    delete:
      tags: [Formación]
      summary: Eliminar recurso lógicamente
      responses:
        '200': { $ref: '#/components/responses/Mensaje' }
  /recursos-formativos/{id}/descarga:
    get:
      tags: [Formación]
      summary: Descargar archivo autorizado
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Archivo descargado.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404': { $ref: '#/components/responses/Error' }
  /actividades-formativas:
    get:
      tags: [Formación]
      summary: Listar actividades prácticas activas
      parameters:
        - in: query
          name: modulo_id
          schema: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/ListaPaginada' }
    post:
      tags: [Formación]
      summary: Crear actividad de módulo o de lecciones
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [titulo]
              properties:
                modulo_id: { type: integer, nullable: true }
                titulo: { type: string }
                descripcion: { type: string, nullable: true }
                instrucciones: { type: string, nullable: true }
                lecciones: { type: array, items: { type: integer } }
      responses:
        '201': { $ref: '#/components/responses/Objeto' }
        '422': { $ref: '#/components/responses/Validacion' }
  /actividades-formativas/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Formación]
      summary: Consultar actividad
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
    put:
      tags: [Formación]
      summary: Actualizar actividad
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                modulo_id: { type: integer, nullable: true }
                titulo: { type: string }
                descripcion: { type: string, nullable: true }
                instrucciones: { type: string, nullable: true }
                lecciones: { type: array, items: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
    delete:
      tags: [Formación]
      summary: Desactivar actividad
      responses:
        '200': { $ref: '#/components/responses/Mensaje' }
  /actividades-formativas/{id}/entregas:
    get:
      tags: [Formación]
      summary: Listar entregas (docente solo ve las propias)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200': { $ref: '#/components/responses/ListaPaginada' }
    post:
      tags: [Formación]
      summary: Entregar actividad e iniciar un intento
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                respuesta: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Objeto' }
        '404': { $ref: '#/components/responses/Error' }
  /diagnosticos:
    get:
      tags: [Diagnóstico]
      summary: Listar diagnósticos (administrador o sistemas)
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
    post:
      tags: [Diagnóstico]
      summary: Crear diagnóstico
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [titulo]
              properties:
                titulo: { type: string }
                descripcion: { type: string }
                estado: { type: string, enum: [activo, inactivo] }
      responses:
        '201': { $ref: '#/components/responses/Objeto' }
  /diagnosticos/disponible:
    get:
      tags: [Diagnóstico]
      summary: Consultar diagnóstico activo para el docente
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
  /diagnosticos/mi-ultimo-intento:
    get:
      tags: [Diagnóstico]
      summary: Consultar el último intento propio de diagnóstico
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
  /diagnosticos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Diagnóstico]
      summary: Consultar diagnóstico y preguntas
      description: Las respuestas correctas no se exponen a perfiles docentes.
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
    put:
      tags: [Diagnóstico]
      summary: Actualizar diagnóstico
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                titulo: { type: string }
                descripcion: { type: string }
                estado: { type: string, enum: [activo, inactivo] }
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
    delete:
      tags: [Diagnóstico]
      summary: Desactivar/eliminar diagnóstico sin historial
      responses:
        '200': { $ref: '#/components/responses/Mensaje' }
  /diagnosticos/{id}/preguntas:
    post:
      tags: [Diagnóstico]
      summary: Agregar pregunta y opciones
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreguntaEntrada'
      responses:
        '201': { $ref: '#/components/responses/Objeto' }
        '422': { $ref: '#/components/responses/Validacion' }
  /preguntas-diagnostico/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Diagnóstico]
      summary: Actualizar pregunta y reemplazar opciones
      description: No permite editar preguntas que ya tienen respuestas registradas.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreguntaActualizacion'
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Diagnóstico]
      summary: Eliminar pregunta sin respuestas asociadas
      responses:
        '200': { $ref: '#/components/responses/Mensaje' }
        '409': { $ref: '#/components/responses/Error' }
  /diagnosticos/{id}/intentos:
    post:
      tags: [Diagnóstico]
      summary: Iniciar el diagnóstico único del docente
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
