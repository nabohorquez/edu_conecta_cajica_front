        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespuestasEntrada'
      responses:
        '200': { $ref: '#/components/responses/Mensaje' }
        '422': { $ref: '#/components/responses/Validacion' }
  /intentos-diagnostico/{id}/finalizar:
    post:
      tags: [Diagnóstico]
      summary: Finalizar el intento y calcular resultado
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
        '422': { $ref: '#/components/responses/Validacion' }
  /evaluaciones:
    get:
      tags: [Evaluaciones]
      summary: Listar evaluaciones activas
      parameters:
        - in: query
          name: modulo_id
          schema: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/ListaPaginada' }
    post:
      tags: [Evaluaciones]
      summary: Crear evaluación de módulo
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [modulo_id, titulo]
              properties:
                modulo_id: { type: integer }
                titulo: { type: string }
                descripcion: { type: string }
                puntaje_minimo: { type: number, minimum: 0, maximum: 100, default: 60 }
                estado: { type: string, enum: [activo, inactivo] }
      responses:
        '201': { $ref: '#/components/responses/Objeto' }
  /evaluaciones/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Evaluaciones]
      summary: Consultar preguntas y opciones de una evaluación
      description: Las respuestas correctas no se exponen a perfiles docentes.
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
    put:
      tags: [Evaluaciones]
      summary: Actualizar evaluación
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                modulo_id: { type: integer }
                titulo: { type: string }
                descripcion: { type: string }
                puntaje_minimo: { type: number, minimum: 0, maximum: 100 }
                estado: { type: string, enum: [activo, inactivo] }
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
    delete:
      tags: [Evaluaciones]
      summary: Desactivar evaluación conservando resultados
      responses:
        '200': { $ref: '#/components/responses/Mensaje' }
  /evaluaciones/{id}/preguntas:
    post:
      tags: [Evaluaciones]
      summary: Agregar pregunta y opciones
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreguntaEntrada'
      responses:
        '201': { $ref: '#/components/responses/Objeto' }
  /preguntas-evaluacion/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Evaluaciones]
      summary: Actualizar pregunta y reemplazar opciones
      description: No permite editar preguntas que ya tienen respuestas registradas.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreguntaActualizacion'
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Evaluaciones]
      summary: Eliminar pregunta sin respuestas asociadas
      responses:
        '200': { $ref: '#/components/responses/Mensaje' }
        '409': { $ref: '#/components/responses/Error' }
  /evaluaciones/{id}/intentos:
    post:
      tags: [Evaluaciones]
      summary: Iniciar evaluación después de completar las lecciones
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '201': { $ref: '#/components/responses/Objeto' }
        '409': { $ref: '#/components/responses/Error' }
  /intentos-evaluacion/{id}/respuestas:
    put:
      tags: [Evaluaciones]
      summary: Guardar respuestas del intento propio
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespuestasEntrada'
      responses:
        '200': { $ref: '#/components/responses/Mensaje' }
        '422': { $ref: '#/components/responses/Validacion' }
  /intentos-evaluacion/{id}/finalizar:
    post:
      tags: [Evaluaciones]
      summary: Calificar y finalizar intento
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
        '422': { $ref: '#/components/responses/Validacion' }
  /intentos-evaluacion/{id}/resultado:
    get:
      tags: [Evaluaciones]
      summary: Consultar resultado; docentes solo consultan el propio
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
        '404': { $ref: '#/components/responses/Error' }
  /progreso/mi-progreso:
    get:
      tags: [Seguimiento e informes]
      summary: Consultar progreso detallado propio
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
  /progreso/resumen:
    get:
      tags: [Seguimiento e informes]
      summary: Consultar avance consolidado por módulo
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
  /seguimiento/docentes:
    get:
      tags: [Seguimiento e informes]
      summary: Listar docentes y su progreso consolidado (administrador, capacitador o sistemas)
      parameters:
        - in: query
          name: buscar
          schema: { type: string }
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200': { $ref: '#/components/responses/ListaPaginada' }
        '403': { $ref: '#/components/responses/Error' }
  /seguimiento/docentes/{usuarioId}:
    get:
      tags: [Seguimiento e informes]
      summary: Consultar progreso de un docente (capacitador, administrador o sistemas)
      parameters:
        - in: path
          name: usuarioId
          required: true
          schema: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
        '404': { $ref: '#/components/responses/Error' }
  /plazos-modulos:
    get:
      tags: [Seguimiento e informes]
      summary: Listar plazos por módulo
      parameters:
        - in: query
          name: modulo_id
          schema: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/ListaPaginada' }
    post:
      tags: [Seguimiento e informes]
      summary: Crear plazo (administrador, capacitador o sistemas)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [modulo_id, fecha_fin]
              properties:
                modulo_id: { type: integer }
                fecha_inicio: { type: string, format: date-time, nullable: true }
                fecha_fin: { type: string, format: date-time }
                estado: { type: string, enum: [activo, inactivo] }
      responses:
        '201': { $ref: '#/components/responses/Objeto' }
  /plazos-modulos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Seguimiento e informes]
      summary: Consultar plazo
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
    put:
      tags: [Seguimiento e informes]
      summary: Actualizar plazo
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                modulo_id: { type: integer }
                fecha_inicio: { type: string, format: date-time, nullable: true }
                fecha_fin: { type: string, format: date-time }
                estado: { type: string, enum: [activo, inactivo] }
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
    delete:
      tags: [Seguimiento e informes]
      summary: Eliminar plazo
      responses:
        '200': { $ref: '#/components/responses/Mensaje' }
  /reportes/progreso:
    get:
      tags: [Seguimiento e informes]
      summary: Generar informe de progreso y calificaciones
      parameters:
        - in: query
          name: usuario_id
          schema: { type: integer }
        - in: query
          name: desde
          schema: { type: string, format: date }
        - in: query
          name: hasta
          schema: { type: string, format: date }
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
  /reportes/progreso/exportar:
    get:
      tags: [Seguimiento e informes]
      summary: Exportar informe de progreso como CSV
      responses:
        '200':
          description: Archivo CSV generado.
          content:
            text/csv:
              schema:
                type: string
                format: binary
  /conectividad/mediciones:
    post:
      tags: [Conectividad y notificaciones]
      summary: Registrar medición de conectividad propia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                velocidad_bajada: { type: number, minimum: 0 }
                velocidad_subida: { type: number, minimum: 0 }
                latencia_ms: { type: number, minimum: 0 }
                tipo_conexion: { type: string, maxLength: 50 }
                estado: { type: string, enum: [buena, limitada, sin_conexion] }
      responses:
        '201': { $ref: '#/components/responses/Objeto' }
  /conectividad/ultima-medicion:
    get:
      tags: [Conectividad y notificaciones]
      summary: Consultar última medición propia
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
  /reportes/conectividad:
    get:
      tags: [Seguimiento e informes]
      summary: Consultar mediciones de conectividad (administración o capacitador)
      parameters:
        - in: query
          name: usuario_id
          schema: { type: integer }
        - in: query
          name: desde
          schema: { type: string, format: date-time }
        - in: query
          name: hasta
          schema: { type: string, format: date-time }
      responses:
        '200': { $ref: '#/components/responses/ListaPaginada' }
  /reportes/tecnicos:
    get:
      tags: [Seguimiento e informes]
      summary: Consultar métricas técnicas agregadas por ruta, método y código de estado (sistemas)
      parameters:
        - in: query
          name: tipo
          schema: { type: string, enum: [requests, performance, errors] }
        - in: query
          name: metodo
          schema: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
        - in: query
          name: codigo_estado
          schema: { type: integer, minimum: 100, maximum: 599 }
        - in: query
          name: desde
          schema: { type: string, format: date }
        - in: query
          name: hasta
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200': { $ref: '#/components/responses/ListaPaginada' }
        '403': { $ref: '#/components/responses/Error' }
  /notificaciones:
    get:
      tags: [Conectividad y notificaciones]
      summary: Listar notificaciones propias
      parameters:
        - in: query
          name: no_leidas
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
  /notificaciones/{id}/leida:
    patch:
      tags: [Conectividad y notificaciones]
      summary: Marcar notificación propia como leída
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
        '404': { $ref: '#/components/responses/Error' }
  /tableros/administrador:
    get:
      tags: [Tableros]
      summary: Consultar métricas generales y docentes inactivos
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
  /tableros/capacitador:
    get:
      tags: [Tableros]
      summary: Consultar docentes inactivos, plazos y conectividad reciente
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
  /tableros/docente:
    get:
      tags: [Tableros]
      summary: Consultar resumen de formación y próximos plazos propios
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
  /tableros/sistemas:
    get:
      tags: [Tableros]
      summary: Consultar métricas técnicas agregadas de los últimos meses
      parameters:
        - in: query
          name: meses
          schema: { type: integer, minimum: 1, maximum: 12, default: 2 }
      responses:
        '200': { $ref: '#/components/responses/Objeto' }
components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: Usa el token emitido por iniciar sesión.
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: integer }
    PorPagina:
      in: query
      name: por_pagina
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Error:
      description: Error de autenticación, permisos, recurso o conflicto.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Validacion:
      description: Error de validación.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorValidacion' }
    Mensaje:
      description: Operación procesada.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Mensaje' }
    Objeto:
      description: Recurso o resultado.
      content:
        application/json:
          schema:
            type: object
    ListaPaginada:
      description: Lista de recursos paginada por Laravel.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: array, items: { type: object } }
              current_page: { type: integer }
              last_page: { type: integer }
              per_page: { type: integer }
              total: { type: integer }
  schemas:
    Error:
      type: object
      properties:
        mensaje: { type: string }
    ErrorValidacion:
      type: object
      properties:
        mensaje: { type: string }
        errores:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    Mensaje:
      type: object
      properties:
        mensaje: { type: string }
    Usuario:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        email: { type: string, format: email }
        username: { type: string, nullable: true }
        activo: { type: boolean }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Rol' }
    Rol:
      type: object
      properties:
        id: { type: integer }
        rol_name: { type: string }
        description: { type: string, nullable: true }
    ModuloEntrada:
      type: object
      required: [nombre]
      properties:
        nivel_id: { type: integer, nullable: true }
        nombre: { type: string, maxLength: 150 }
        descripcion: { type: string, nullable: true }
        estado: { type: string, enum: [activo, inactivo] }
        competencias: { type: array, items: { type: integer } }
    LeccionEntrada:
      type: object
      required: [modulo_id, titulo]
      properties:
        modulo_id: { type: integer }
        titulo: { type: string, maxLength: 200 }
        descripcion: { type: string, nullable: true }
        orden: { type: integer, minimum: 0 }
        estado: { type: string, enum: [activo, inactivo] }
    PreguntaEntrada:
      type: object
      required: [enunciado, tipo, puntaje]
      properties:
        competencia_id: { type: integer, nullable: true }
        nivel_id: { type: integer, nullable: true }
        enunciado: { type: string }
        tipo: { type: string, enum: [seleccion_unica] }
        puntaje: { type: number, minimum: 0 }
        orden: { type: integer, minimum: 0 }
        obligatoria: { type: boolean }
        opciones:
          type: array
          minItems: 2
          description: Debe incluir exactamente una opción con es_correcta igual a true.
          items:
            type: object
            required: [texto, es_correcta]
            properties:
              texto: { type: string }
              es_correcta: { type: boolean }
              orden: { type: integer }
    PreguntaActualizacion:
      type: object
      description: Campos opcionales; si se envían opciones, deben incluir exactamente una correcta.
      properties:
        competencia_id: { type: integer, nullable: true }
        nivel_id: { type: integer, nullable: true }
        enunciado: { type: string }
        tipo: { type: string, enum: [seleccion_unica] }
        puntaje: { type: number, minimum: 0 }
        orden: { type: integer, minimum: 0 }
        obligatoria: { type: boolean }
        opciones:
          type: array
          minItems: 2
          items:
            type: object
            required: [texto, es_correcta]
            properties:
              texto: { type: string }
              es_correcta: { type: boolean }
              orden: { type: integer }
    RespuestasEntrada:
      type: object
      required: [respuestas]
      properties:
        respuestas:
          type: array
          minItems: 1
          items:
            type: object
            required: [pregunta_id, opcion_id]
            properties:
              pregunta_id: { type: integer }
              opcion_id: { type: integer }
